name: Desktop Release (all platforms)

# 打 tag（v*）→ 三端矩阵打包 → 上传 GitHub Release（草稿，人工确认后发布）
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--bundles dmg'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun (sidecar compile)
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux 桌面依赖（Tauri 2 + AppImage）
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install workspace deps (client build)
        run: pnpm install --frozen-lockfile

      # 仓库 lockfile 历史曾混入内网 registry（阿里），runner 连不上：
      # 强制官方 registry 并 replace-registry-host，忽略 lockfile 的 resolved host
      - name: Install desktop deps
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm install
        working-directory: desktop

      # beforeBuildCommand（build-desktop.sh）会自行构建 H5 + bun 编译 sidecar，
      # tauri-action 负责 tauri build + 上传产物到 Release
      - name: Build & upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'CoEditor Desktop ${{ github.ref_name }}'
          releaseBody: '开源版桌面客户端（Tauri 2，内置本地 server sidecar）。数据仅存本机。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
