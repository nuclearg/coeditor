name: Desktop Release (all platforms)

# 打 tag（v*）→ macOS/Windows 矩阵打包 + Linux 容器打包 → 上传 GitHub Release（草稿，人工确认后发布）
# 也支持手工触发（Actions → Run workflow），用 release_tag 输入指定目标 tag
#
# Linux 独立成 linux job：GitHub 托管 runner 用 ubuntu-24.04（22.04 runner 标签已弃用：
# 2026-09 起 brownout、2027-04 停用），但构建跑在 ubuntu:22.04 容器里，产物保持 glibc>=2.35 下限。
# 原因：Tauri 官方建议用「最老且自带 WebKitGTK 4.1 的基础系统」出 Linux 包，否则在 Ubuntu 22.04 /
# WSL2 等较旧环境会报 GLIBC_2.3x not found（详见 https://tauri.app/distribute/appimage/）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（Draft Release 的目标 tag），例如 v0.1.0'
        required: false
        default: 'v0.1.0'
        type: string

# 需要创建/编辑 Release 与上传资产：给 GITHUB_TOKEN 显式授予 contents 写权限
permissions:
  contents: write

jobs:
  build:
    env:
      # tag 触发时用 tag 名；手工触发时用输入的 release_tag
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：arm64（Apple Silicon）与 x86_64（Intel）各一个 runner 出原生包
          - platform: macos-latest
            args: '--bundles dmg'     # arm64（macos-latest 现指向 macOS 26 arm64）
          - platform: macos-15-intel
            args: '--bundles dmg'     # x86_64 / Intel（macos-13 已于 2025-12-04 退役，改用官方迁移标签；Intel 架构 CI 支持到 2027 秋）
          - platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun (sidecar compile)
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace deps (client build)
        run: pnpm install --frozen-lockfile

      # 仓库 lockfile 历史曾混入内网 registry（阿里），runner 连不上：
      # 强制官方 registry 并 replace-registry-host，忽略 lockfile 的 resolved host
      - name: Install desktop deps
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm install
        working-directory: desktop

      # ---------- macOS：Apple 签名 + 公证（未配 secrets 时自动降级为 ad-hoc） ----------
      # 凭据准备与步骤细节见 docs/desktop-signing.md
      - name: Prepare notarization API key (.p8)
        if: matrix.platform != 'windows-latest'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ] || [ -z "${APPLE_API_KEY:-}" ]; then
            echo "::notice::未配置 APPLE_API_KEY / APPLE_API_KEY_P8_BASE64——不做公证（用户首次打开需手动放行）"
            exit 0
          fi
          # 写到 Tauri 打包器的默认搜索路径之一，并显式给出 APPLE_API_KEY_PATH（双保险）
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          # 关键：公证变量只在有值时写入 GITHUB_ENV，**绝不在 env: 里声明成空串**。
          # 空串与未定义对 Tauri 是两回事——空串会被当成"身份=空"，覆盖配置里的 ad-hoc "-"，
          # 直接导致 codesign --sign "" 失败（CI 实测踩过）。
          {
            echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            [ -n "${APPLE_API_ISSUER:-}" ] && echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            [ -n "${APPLE_TEAM_ID:-}" ] && echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV" || true
          echo "公证凭据已就位：AuthKey_${APPLE_API_KEY}.p8"

      - name: Import Apple signing certificate
        if: matrix.platform != 'windows-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::未配置 APPLE_CERTIFICATE——本次为 ad-hoc 签名，用户首次打开需在「隐私与安全性」放行（见 docs/desktop-signing.md）"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain   # 让 codesign 搜得到
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning build.keychain
          # 显式导出签名身份：它会**覆盖** tauri.conf.json 的 signingIdentity "-"，
          # 于是本地 ad-hoc 路径不受影响，而 CI 一定走 Developer ID。
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::keychain 里没有 Developer ID Application 证书（.p12 是否只导出了证书、未含私钥？）"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "已导入签名身份：$IDENTITY"

      - name: Prepare distribution entitlements config
        if: matrix.platform != 'windows-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          # 只有真走 Developer ID 分发时才覆盖 entitlements：分发版去掉了
          # disable-library-validation，而 ad-hoc（无证书）恰恰需要它，否则运行期
          # 加载内嵌组件会失败。未配证书就保持仓库默认，行为与今天一致。
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::未配置证书，本次不覆盖 entitlements（保持 ad-hoc 默认）"
            exit 0
          fi
          cat > "$RUNNER_TEMP/tauri-dist.conf.json" <<EOF
          { "bundle": { "macOS": { "entitlements": "$GITHUB_WORKSPACE/desktop/scripts/macos-entitlements-dist.plist" } } }
          EOF
          cat "$RUNNER_TEMP/tauri-dist.conf.json"
          echo "TAURI_DIST_CONFIG=$RUNNER_TEMP/tauri-dist.conf.json" >> "$GITHUB_ENV"

      # beforeBuildCommand（build-desktop.sh）会自行构建 H5 + bun 编译 sidecar。
      # macOS：tauri-action 负责 tauri build（签名 → 公证 .app → staple）+ 上传产物到 Release
      - name: Build & upload (macOS)
        if: matrix.platform != 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          # Apple 相关变量由前面的步骤按「有值才写」的方式注入 GITHUB_ENV，
          # 这里**不要**再声明（声明成空串会让 Tauri 用空身份签名而失败）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'CoEditor Desktop ${{ env.RELEASE_TAG }}'
          releaseBody: '桌面客户端（Tauri 2，内置本地 server sidecar）。数据仅存本机。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.TAURI_DIST_CONFIG != '' && format('--config {0}', env.TAURI_DIST_CONFIG) || '' }}

      # 签名闸门（fail closed）：坏签名的包用户根本无法运行（内核 SIGKILL，连「仍要打开」都不出现）。
      # 两道：① 签名完整性（历史坑；ad-hoc 时允许自动重签修复）
      #       ② 分发达标（Developer ID + hardened runtime + Gatekeeper + 公证票据；配了证书即强制）
      - name: Verify macOS signature & notarization (fail closed)
        if: matrix.platform != 'windows-latest'
        working-directory: desktop
        env:
          # 公证凭据（若已配置）由前序步骤写入 GITHUB_ENV；这里只声明判定开关，
          # 避免把 APPLE_* 声明成空串（脚本里用 ${VAR:-} 取值，未定义也安全）
          REQUIRE_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(src-tauri/target/release/bundle/macos/*.app src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "未找到任何 .app/.dmg 产物" >&2; exit 1
          fi
          for t in "${targets[@]}"; do
            echo "==> ① 签名完整性 $t"
            bash scripts/verify-macos-signature.sh "$t" "${APPLE_SIGNING_IDENTITY:-}"
            echo "==> ② 分发达标 $t"
            bash scripts/verify-macos-dist.sh "$t"
          done

      # ---- Windows：出 NSIS 安装版（-setup.exe）+ zip 便携包（-portable.zip）----
      # 便携包 = 把 NSIS 静默安装到临时目录（布局与真实安装一致），再打成 zip；
      # 不再依赖 7-Zip / 自解压 SFX。
      - name: Build Windows (NSIS)
        if: matrix.platform == 'windows-latest'
        run: npx tauri build --bundles nsis
        working-directory: desktop

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: desktop
        run: |
          # 便携包直接从构建产物组包（不执行 NSIS 安装，避免权限/静默安装差异）：
          #   主程序 target/release/coeditor-desktop.exe → CoEditor.exe
          #   sidecar target/release/coeditor-server.exe → coeditor-server.exe
          #   resources ../../packages/client/dist-h5 → dist-h5/
          $rel = 'src-tauri\target\release'
          $appRoot = Join-Path $env:RUNNER_TEMP 'portable\CoEditor'
          New-Item -ItemType Directory -Force -Path $appRoot | Out-Null

          $mainExe = Get-ChildItem -Path $rel -Filter 'coeditor-desktop.exe' | Select-Object -First 1
          if (-not $mainExe) { throw "main exe (coeditor-desktop.exe) not found in $rel" }
          Copy-Item $mainExe.FullName (Join-Path $appRoot 'CoEditor.exe')

          $sidecar = Get-ChildItem -Path $rel -Filter 'coeditor-server.exe' | Select-Object -First 1
          if (-not $sidecar) { $sidecar = Get-ChildItem -Path 'src-tauri\binaries' -Filter 'coeditor-server-*.exe' | Select-Object -First 1 }
          if (-not $sidecar) { throw 'sidecar (coeditor-server.exe) not found' }
          Copy-Item $sidecar.FullName (Join-Path $appRoot 'coeditor-server.exe')

          # dist-h5 在仓库根 packages/client/dist-h5（desktop 的上一级）
          $dist = Resolve-Path '..\packages\client\dist-h5' -ErrorAction SilentlyContinue
          if (-not $dist) { throw 'dist-h5 not found（H5 前端未构建？）' }
          Copy-Item -Recurse $dist (Join-Path $appRoot 'dist-h5')

          # 校验便携包关键件齐全后压缩
          foreach ($need in @('CoEditor.exe', 'coeditor-server.exe', 'dist-h5')) {
            if (-not (Test-Path (Join-Path $appRoot $need))) { throw "portable layout missing: $need" }
          }
          $nsisDir = 'src-tauri/target/release/bundle/nsis'
          $setup = Get-ChildItem -Path $nsisDir -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup exe not found' }
          $base = $setup.BaseName -replace '-setup$', ''      # CoEditor_0.1.0_x64
          $zipPath = Join-Path (Get-Location) ($base + '-portable.zip')
          Compress-Archive -Path $appRoot -DestinationPath $zipPath -CompressionLevel Optimal -Force
          Get-Item $zipPath | Select-Object Name, Length

      - name: Upload Windows release assets
        if: matrix.platform == 'windows-latest'
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "CoEditor Desktop ${{ env.RELEASE_TAG }}" \
            --notes '桌面客户端（Tauri 2，内置本地 server sidecar）。数据仅存本机。Windows 提供 NSIS 安装版与 zip 便携版。' \
            --draft || true
          gh release upload "${{ env.RELEASE_TAG }}" \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            CoEditor_*_x64-portable.zip --clobber

  # ---- Linux x64（deb + AppImage）----
  linux:
    # runner 用受支持的 ubuntu-24.04，构建基座用 ubuntu:22.04 容器：
    # 产物 glibc 下限 = 2.35 → 可跑 Ubuntu 22.04+ / Debian 12+（含 WSL2 里的 Ubuntu 22.04）
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      # 容器内没有 /dev/fuse：linuxdeploy（AppImage 工具）无法挂载，改为解包运行
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      # 精简 ubuntu:22.04 容器需要自备工具链（注意与 build job 的 macOS 步骤保持同步逻辑）：
      #   git/curl/ca-certificates：checkout 与各 setup action 需要
      #   node：GitHub Actions 的 JS action 在容器内执行需要 node；apt 的 node 太旧，装 NodeSource 20
      #   build-essential/pkg-config/libssl-dev：Rust 编译
      #   libwebkit2gtk-4.1-dev 等：Tauri 2（WebKitGTK 4.1）构建依赖，22.04 官方源自带
      - name: Prepare container toolchain
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git curl ca-certificates unzip xz-utils \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file \
            xdg-utils
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
          npm install -g pnpm@9
          node --version && pnpm --version

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun (sidecar compile)
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace deps (client build)
        run: pnpm install --frozen-lockfile

      # 仓库 lockfile 历史曾混入内网 registry（阿里），runner 连不上：
      # 强制官方 registry 并 replace-registry-host，忽略 lockfile 的 resolved host
      - name: Install desktop deps
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm install
        working-directory: desktop

      # beforeBuildCommand（build-desktop.sh）会自行构建 H5 + bun 编译 sidecar；
      # tauri-action 负责 tauri build（deb + AppImage）+ 上传产物到 Release
      - name: Build & upload (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'CoEditor Desktop ${{ env.RELEASE_TAG }}'
          releaseBody: '桌面客户端（Tauri 2，内置本地 server sidecar）。数据仅存本机。'
          releaseDraft: true
          prerelease: false
          args: '--bundles deb,appimage'
