name: Desktop macOS preview

# 每次 push 到 main → 仅打 macOS dmg（日常验证用），产物上传为 Actions artifact。
# 注意：不要忽略 .github/**——否则 workflow 自身变更的 push 不触发，无法验证/迭代。
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun (sidecar compile)
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # 仓库 lockfile 历史曾混入内网 registry（阿里），runner 连不上：
      # 强制官方 registry 并 replace-registry-host，忽略 lockfile 的 resolved host
      - name: Install desktop deps
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm install
        working-directory: desktop

      # 无 tag：只构建（beforeBuildCommand 自产 H5 + sidecar），不发布
      - name: Build dmg
        uses: tauri-apps/tauri-action@v0
        with:
          args: '--bundles dmg'

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: coeditor-desktop-macos-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
