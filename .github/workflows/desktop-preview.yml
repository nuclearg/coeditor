name: Desktop macOS preview

# 每次 push 到 main → 仅打 macOS dmg（日常验证用），产物上传为 Actions artifact。
# 注意：不要忽略 .github/**——否则 workflow 自身变更的 push 不触发，无法验证/迭代。
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun (sidecar compile)
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # 仓库 lockfile 历史曾混入内网 registry（阿里），runner 连不上：
      # 强制官方 registry 并 replace-registry-host，忽略 lockfile 的 resolved host
      - name: Install desktop deps
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm install
        working-directory: desktop

      # ---------- Apple 签名 + 公证（未配 secrets 时自动降级为 ad-hoc） ----------
      # 凭据准备与步骤细节见 docs/desktop-signing.md
      - name: Prepare notarization API key (.p8)
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ] || [ -z "${APPLE_API_KEY:-}" ]; then
            echo "::notice::未配置 APPLE_API_KEY / APPLE_API_KEY_P8_BASE64——不做公证（用户首次打开需手动放行）"
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          echo "公证凭据已就位：AuthKey_${APPLE_API_KEY}.p8"

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::未配置 APPLE_CERTIFICATE——本次为 ad-hoc 签名，用户首次打开需在「隐私与安全性」放行（见 docs/desktop-signing.md）"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning build.keychain
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::keychain 里没有 Developer ID Application 证书（.p12 是否只导出了证书、未含私钥？）"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "已导入签名身份：$IDENTITY"

      - name: Prepare distribution entitlements config
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/tauri-dist.conf.json" <<EOF
          { "bundle": { "macOS": { "entitlements": "$GITHUB_WORKSPACE/desktop/scripts/macos-entitlements-dist.plist" } } }
          EOF
          cat "$RUNNER_TEMP/tauri-dist.conf.json"
          echo "TAURI_DIST_CONFIG=$RUNNER_TEMP/tauri-dist.conf.json" >> "$GITHUB_ENV"

      # 无 tag：只构建（beforeBuildCommand 自产 H5 + sidecar），不发布
      - name: Build dmg
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./desktop
          args: '--bundles dmg --config ${{ env.TAURI_DIST_CONFIG }}'

      # 签名闸门（fail closed）：坏签名的包用户根本无法运行（内核 SIGKILL，连「仍要打开」都不出现）。
      # 两道：① 签名完整性（ad-hoc 时允许自动重签修复）② 分发达标（Developer ID + 公证票据）
      - name: Verify macOS signature & notarization (fail closed)
        working-directory: desktop
        env:
          REQUIRE_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE != '' && '1' || '0' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(src-tauri/target/release/bundle/macos/*.app src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "未找到任何 .app/.dmg 产物" >&2; exit 1
          fi
          for t in "${targets[@]}"; do
            echo "==> ① 签名完整性 $t"
            bash scripts/verify-macos-signature.sh "$t" "${APPLE_SIGNING_IDENTITY:-}"
            echo "==> ② 分发达标 $t"
            bash scripts/verify-macos-dist.sh "$t"
          done

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v6
        with:
          name: coeditor-desktop-macos-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
