name: Desktop macOS preview

# 每次 push 到 main → 仅打 macOS dmg（日常验证用），产物上传为 Actions artifact。
# 注意：不要忽略 .github/**——否则 workflow 自身变更的 push 不触发，无法验证/迭代。
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun (sidecar compile)
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # 仓库 lockfile 历史曾混入内网 registry（阿里），runner 连不上：
      # 强制官方 registry 并 replace-registry-host，忽略 lockfile 的 resolved host
      - name: Install desktop deps
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm install
        working-directory: desktop

      # 无 tag：只构建（beforeBuildCommand 自产 H5 + sidecar），不发布
      - name: Build dmg
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./desktop
          args: '--bundles dmg'

      # 签名闸门：坏签名的包用户根本无法运行（内核 SIGKILL，连「仍要打开」都不出现）。
      # tauri.conf.json 已配 bundle.macOS.signingIdentity="-"（ad-hoc），此处校验并兜底重签。
      # 校验失败即中断，避免把打不开的包传出去。
      - name: Verify macOS signature (fail closed)
        working-directory: desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(src-tauri/target/release/bundle/macos/*.app src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "未找到任何 .app/.dmg 产物" >&2; exit 1
          fi
          for t in "${targets[@]}"; do
            echo "==> 校验 $t"
            bash scripts/verify-macos-signature.sh "$t"
          done

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v6
        with:
          name: coeditor-desktop-macos-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
