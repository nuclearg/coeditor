<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- 宋代展脚幞头 - 纯色平面填充 -->
  <g fill="#000000">
    <!-- 帽身主体 (硬胎帽围) -->
    <path d="M140,100 
             C140,50 160,30 200,30 
             C240,30 260,50 260,100 
             L260,120 
             L140,120 Z" />
    
    <!-- 左侧展脚 (平直向外伸展) -->
    <rect x="20" y="95" width="120" height="18" rx="2" />
    
    <!-- 右侧展脚 (平直向外伸展) -->
    <rect x="260" y="95" width="120" height="18" rx="2" />
    
    <!-- 顶部折上巾结构线 (装饰性平面分割) -->
    <path d="M170,30 L170,60 M230,30 L230,60" 
          stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.3"/>
  </g>
</svg>
